syntax = "proto3";

package ocr;

service OcrService {
  rpc ExtractText (ExtractTextRequest) returns (ExtractTextResponse);
}

message ExtractTextRequest {
  bytes image = 1;
  string mime_type = 2;
}

message ExtractTextResponse {
  string raw_text = 1;
  repeated string medicines = 2;
  bool success = 3;
  string error = 4;
}