server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: medibook-core-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: medibook-core-service
          __path__: /logs/core/*.log

  - job_name: medibook-commerce-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: medibook-commerce-service
          __path__: /logs/commerce/*.log