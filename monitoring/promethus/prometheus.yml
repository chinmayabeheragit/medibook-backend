global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'medibook-core-service'
    static_configs:
      - targets: ['host.docker.internal:5002']

  - job_name: 'medibook-commerce-service'
    static_configs:
      - targets: ['host.docker.internal:5001']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']